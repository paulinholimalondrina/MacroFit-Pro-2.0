name: Deploy MacroFit Pro to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Build and Publish Web App + Android APK to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WORKDIR=$(mktemp -d)
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORKDIR/repo"
          cd "$WORKDIR/repo"

          # Rebuild latest source into dist/ and docs/ if npm is available
          if command -v npm >/dev/null 2>&1; then
            npm install --legacy-peer-deps --no-audit --no-fund || true
            npm run build || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STAGE_DIR=$(mktemp -d)
          cp -r docs/. "$STAGE_DIR/"
          touch "$STAGE_DIR/.nojekyll"

          git checkout --orphan gh-pages
          git rm -rf . > /dev/null 2>&1 || true
          cp -r "$STAGE_DIR"/. .
          git add -A
          git commit -m "chore: deploy MacroFit Pro Web, Recharts 7-Day Progress & Android APK to GitHub Pages"
          git push -f origin gh-pages

          # Automatically enable GitHub Pages on gh-pages branch if API allows
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" 2>/dev/null || \
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" 2>/dev/null || true

          echo "✅ Deploy concluído com sucesso na branch gh-pages e pasta /docs!"
          echo "🌐 URL do GitHub Pages: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
